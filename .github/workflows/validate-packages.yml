name: Validate packages

on:
  pull_request:
  push:
    branches: ["main"]
  # `validate` is a required status check. PRs opened by GITHUB_TOKEN (notably
  # release-please's) do not fire `pull_request`, so the check never reports and
  # those PRs stay permanently BLOCKED. workflow_dispatch lets the run be
  # started against the PR's branch so the required context can report.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate Homebrew formulas and casks
        shell: bash
        run: |
          set -euo pipefail
          ruby scripts/validate-homebrew.rb
          ruby test/validate_homebrew_test.rb

      - name: Validate Scoop manifests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import json

          # Top-level keys every manifest must carry.
          top_required = {"version", "description", "homepage", "license"}
          # url + hash may live either at the root OR nested under
          # architecture.{32bit,64bit,arm64}.* for multi-arch manifests
          # (GoReleaser v2, modern Scoop). Either shape is valid.
          arch_required = {"url", "hash"}
          arch_keys = {"64bit", "32bit", "arm64"}

          files = glob.glob("bucket/*.json")
          if not files:
              print("No Scoop manifests found")
              raise SystemExit(0)

          errors = []
          for path in files:
              with open(path, "r", encoding="utf-8") as f:
                  data = json.load(f)

              missing_top = top_required - set(data)
              if missing_top:
                  errors.append(f"{path}: missing top-level keys: {', '.join(sorted(missing_top))}")
                  continue

              root_has_url_hash = arch_required.issubset(data.keys())
              arch = data.get("architecture")

              if root_has_url_hash:
                  # Single-arch manifest — fine.
                  continue

              if not isinstance(arch, dict) or not arch:
                  errors.append(
                      f"{path}: must have top-level url+hash OR an architecture.{{64bit|32bit|arm64}} block"
                  )
                  continue

              present_arches = [a for a in arch_keys if a in arch]
              if not present_arches:
                  errors.append(
                      f"{path}: architecture block has no known arch key ({', '.join(sorted(arch_keys))})"
                  )
                  continue

              for a in present_arches:
                  block = arch.get(a)
                  if not isinstance(block, dict):
                      errors.append(f"{path}: architecture.{a} is not an object")
                      continue
                  missing = arch_required - set(block)
                  if missing:
                      errors.append(
                          f"{path}: architecture.{a} missing: {', '.join(sorted(missing))}"
                      )

          if errors:
              for e in errors:
                  print(e)
              raise SystemExit(1)
          print(f"Validated {len(files)} Scoop manifest(s)")
          PY

      - name: Validate Chocolatey nuspec XML
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          files = glob.glob("choco/**/*.nuspec", recursive=True)
          if not files:
              print("No Chocolatey nuspec files found")
              raise SystemExit(0)

          for path in files:
              ET.parse(path)
          print(f"Validated {len(files)} nuspec file(s)")
          PY

      # src/data/directory/directory.json is generated from the package
      # manifests but committed to the repo, so it can silently go stale when a
      # manifest is bumped without re-running the generator — which is how the
      # site kept advertising paranoid-passwd 3.6.5 after it had shipped 3.7.0.
      # Regenerate and fail if the committed copy differs.
      - name: Set up Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: ".nvmrc"

      - name: Check generated directory.json is up to date
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          node scripts/generate-directory.mjs
          if ! git diff --quiet -- src/data/directory/directory.json; then
            echo "::error::src/data/directory/directory.json is stale. Run 'node scripts/generate-directory.mjs' and commit the result."
            git --no-pager diff -- src/data/directory/directory.json
            exit 1
          fi
          echo "directory.json is in sync with the package manifests"
